server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Only resolves "backend" when this container is
  # actually running inside the docker-compose network; harmless elsewhere.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Same-host fallback for docker-compose, where the frontend is built with
  # the default VITE_API_BASE=/api and relies on nginx to forward those
  # relative calls server-side to the backend container. On a split
  # deployment (Railway, etc.) the frontend is instead built with
  # VITE_API_BASE set to the backend's own public URL, so the browser calls
  # the backend directly and this block is never actually hit — which is why
  # it must not block nginx from starting even when "backend" doesn't exist.
  location /api {
    set $upstream http://backend:4000;
    proxy_pass $upstream/api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|svg|woff2?|ttf|png|jpg|jpeg|webp)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
